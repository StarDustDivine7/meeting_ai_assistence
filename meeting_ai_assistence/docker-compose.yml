services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: meeting_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./vector_store:/app/vector_store

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ../meeting_frontend
      dockerfile: Dockerfile

    container_name: meeting_frontend

    ports:
      - "8501:8501"

    environment:
      - API_BASE_URL=http://backend:8000/api/v1

    depends_on:
      - backend

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: meeting_postgres

    environment:
      POSTGRES_DB: meeting_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data: